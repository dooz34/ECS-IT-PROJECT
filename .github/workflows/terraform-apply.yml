name: Terraform Apply
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./terraform
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Debug OIDC token claims
        run: |
          curl -sLS "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            | jq -r '.value' | cut -d '.' -f2 | base64 -d 2>/dev/null | jq .
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform Init
        run: terraform init
      - name: Terraform Apply
        run: terraform apply -auto-approve -var="container_image=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/ecs-portfolio:latest"
      - name: Post-deploy health check
        run: |
          echo "Waiting for ECS service and ALB to settle..."
          sleep 30
          URL="https://${{ secrets.APP_DOMAIN }}/"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          if [ "$STATUS" -ne 200 ]; then
            echo "Health check FAILED - $URL returned $STATUS"
            exit 1
          fi
          echo "Health check passed - $URL returned $STATUS"